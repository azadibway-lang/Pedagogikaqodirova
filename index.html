<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maktabgacha pedagogika — attestatsiyaga tayyorgarlik | Manba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFEDF6;
    --paper-warm:#FBF9F4;
    --ink:#211D3B;
    --ink-soft:#514C72;
    --indigo:#322C6D;
    --indigo-2:#453B93;
    --gold:#D98E2A;
    --gold-soft:#F3D9A8;
    --pomegranate:#B23A2E;
    --teal:#2C6E58;
    --teal-soft:#DCEEE6;
    --line:rgba(33,29,59,.14);
    --shadow:0 12px 30px rgba(33,29,59,.10);
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    line-height:1.55;
  }
  h1,h2,h3,.display{font-family:'Unbounded',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  img{max-width:100%;}
  button{cursor:pointer; font-family:inherit;}

  .chevron{
    height:14px;width:100%;
    background-image:
      linear-gradient(135deg, var(--gold) 25%, transparent 25%),
      linear-gradient(225deg, var(--gold) 25%, transparent 25%);
    background-position:0 0;
    background-size:16px 16px;
    opacity:.55;
  }
  .chevron.dark{opacity:.35;filter:brightness(1.6);}

  /* ================= LOGIN ================= */
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:radial-gradient(circle at 82% 0%, var(--indigo-2), var(--indigo) 70%);}
  .login-card{width:100%; max-width:420px; background:var(--paper-warm); border-radius:22px;
    box-shadow:0 24px 60px rgba(0,0,0,.35); overflow:hidden; border:1px solid var(--line);}
  .login-body{padding:42px 34px 34px;}
  .login-mark{display:flex; align-items:center; gap:12px; margin-bottom:26px;}
  .login-mark svg{width:42px;height:42px;flex:0 0 auto;}
  .login-mark .word{font-family:'Unbounded',sans-serif; font-weight:700; font-size:16px; color:var(--indigo); line-height:1.25;}
  .login-mark .sub{font-size:10px; color:var(--pomegranate); letter-spacing:.08em; font-weight:700; font-family:'JetBrains Mono',monospace;}
  .login-body h1{font-size:24px; margin:0 0 8px; color:var(--indigo);}
  .login-body p.lead{color:var(--ink-soft); font-size:14px; margin:0 0 26px; line-height:1.55;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px;}
  .field input{width:100%; padding:14px 16px; border-radius:11px; border:1.5px solid var(--line); background:var(--paper); font-size:16px; outline:none; font-family:'Manrope',sans-serif;}
  .field input:focus{border-color:var(--indigo-2); box-shadow:0 0 0 3px rgba(69,59,147,.15);}
  .login-error{margin-top:12px; font-size:13.5px; color:var(--pomegranate); font-weight:600; display:none;}
  .login-error.show{display:block;}
  .btn-login{border:none; border-radius:11px; padding:14px 20px; font-size:15px; font-weight:700; width:100%;
    margin-top:20px; background:var(--gold); color:var(--indigo);}
  .btn-login:hover{background:#e7a24a;}
  .login-hint{margin-top:22px; padding-top:18px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--ink-soft); line-height:1.6;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:rgba(50,44,109,.96);
    backdrop-filter:blur(6px);
    color:#fff;
    border-bottom:1px solid rgba(255,255,255,.12);
  }
  .topbar-inner{
    max-width:1180px;margin:0 auto;padding:10px 22px;
    display:flex;align-items:center;gap:18px;
  }
  .brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;font-weight:700;font-size:.92rem;letter-spacing:.02em;}
  .brand .medal{width:30px;height:30px;flex:0 0 auto;}
  .navscroll{display:flex;gap:6px;overflow-x:auto;flex:1 1 auto;scrollbar-width:none;}
  .navscroll::-webkit-scrollbar{display:none;}
  .navpill{
    white-space:nowrap;padding:7px 13px;border-radius:999px;
    font-size:.78rem;font-weight:600;color:rgba(255,255,255,.72);
    border:1px solid rgba(255,255,255,.16);cursor:pointer;
    background:transparent;transition:.15s;
  }
  .navpill:hover{color:#fff;border-color:rgba(255,255,255,.4);}
  .navpill.done{background:var(--gold);color:var(--indigo);border-color:var(--gold);}
  .progresswrap{flex:0 0 auto;display:flex;align-items:center;gap:8px;}
  .ringmini{width:34px;height:34px;border-radius:50%;
    background:conic-gradient(var(--gold) calc(var(--pct,0)*1%), rgba(255,255,255,.18) 0);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .ringmini span{width:26px;height:26px;border-radius:50%;background:var(--indigo);
    display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;}
  .progresslabel{font-size:.68rem;color:rgba(255,255,255,.6);display:none;}
  @media(min-width:760px){.progresslabel{display:block;}}
  .who-pill{font-size:.7rem; font-weight:700; color:var(--indigo); background:var(--gold-soft); padding:5px 10px; border-radius:20px; white-space:nowrap;}
  .logout-btn{background:transparent; border:1px solid rgba(255,255,255,.3); color:#fff; border-radius:8px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .logout-btn:hover{border-color:#fff;}

  /* ---------- hero ---------- */
  .hero{
    background:radial-gradient(circle at 82% 0%, var(--indigo-2), var(--indigo) 60%);
    color:#fff;padding:64px 22px 54px;position:relative;overflow:hidden;
  }
  .hero-inner{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.3fr .9fr;gap:40px;align-items:center;}
  @media(max-width:860px){.hero-inner{grid-template-columns:1fr;}}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:.78rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--gold-soft);display:inline-flex;gap:8px;align-items:center;
  }
  .eyebrow::before{content:"";width:20px;height:2px;background:var(--gold);display:inline-block;}
  .hero h1{font-size:clamp(1.9rem,4.2vw,3.1rem);line-height:1.12;margin:16px 0 14px;font-weight:700;}
  .hero h1 em{font-style:normal;color:var(--gold-soft);}
  .hero p.lede{color:rgba(255,255,255,.82);font-size:1.02rem;max-width:56ch;margin:0 0 26px;}
  .hero .meta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px;}
  .chip{font-size:.74rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
    padding:6px 12px;border-radius:999px;color:rgba(255,255,255,.85);}
  .cta{display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:var(--indigo);
    font-weight:700;padding:13px 22px;border-radius:12px;text-decoration:none;font-size:.95rem;
    box-shadow:0 10px 24px rgba(217,142,42,.35);border:none;cursor:pointer;}
  .cta:hover{background:#e7a24a;}
  .hero-medal{display:flex;justify-content:center;}
  .medallion{width:min(280px,80%);}

  .statsrow{max-width:1180px;margin:-30px auto 0;padding:0 22px;position:relative;z-index:5;
    display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media(max-width:760px){.statsrow{grid-template-columns:repeat(2,1fr);}}
  .statcard{background:var(--paper-warm);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);
    border:1px solid var(--line);}
  .statcard .num{font-family:'Unbounded',sans-serif;font-size:1.5rem;color:var(--indigo);font-weight:700;}
  .statcard .lbl{font-size:.76rem;color:var(--ink-soft);margin-top:2px;}

  /* ---------- layout ---------- */
  main{max-width:1180px;margin:0 auto;padding:56px 22px 100px;}
  .sectionhead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap;}
  .sectionhead .kicker{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--pomegranate);}
  .sectionhead h2{font-size:1.5rem;margin:.2em 0 0;}

  .module{
    background:var(--paper-warm);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);margin-bottom:30px;overflow:hidden;scroll-margin-top:80px;
  }
  .module-head{display:flex;gap:16px;align-items:flex-start;padding:24px 26px 18px;}
  .module-badge{
    flex:0 0 auto;width:52px;height:52px;border-radius:50%;background:var(--indigo);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;
    font-weight:700;font-size:1.15rem;position:relative;
  }
  .module-badge.finished{background:var(--teal);}
  .module-title h3{margin:0 0 4px;font-size:1.22rem;}
  .module-title p{margin:0;color:var(--ink-soft);font-size:.9rem;}

  .tabs{display:flex;gap:6px;padding:0 26px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .tabbtn{
    padding:10px 16px;font-size:.84rem;font-weight:700;color:var(--ink-soft);
    background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;font-family:'Manrope',sans-serif;
  }
  .tabbtn.active{color:var(--indigo);border-color:var(--gold);}
  .tabpane{display:none;padding:22px 26px 28px;}
  .tabpane.active{display:block;}

  .lawgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:14px 0;}
  .lawbox{background:var(--paper);border-radius:12px;padding:14px 16px;border:1px solid var(--line);}
  .lawbox .lbl{font-family:'JetBrains Mono',monospace;font-size:.68rem;text-transform:uppercase;
    letter-spacing:.08em;color:var(--pomegranate);margin-bottom:6px;display:block;}
  .lawbox ul{margin:0;padding-left:18px;font-size:.89rem;}
  .lawbox li{margin-bottom:5px;}
  .lawbox p{margin:0;font-size:.89rem;}

  details.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--paper);overflow:hidden;}
  details.acc>summary{list-style:none;cursor:pointer;padding:13px 16px;font-weight:700;font-size:.92rem;
    display:flex;justify-content:space-between;align-items:center;color:var(--indigo);}
  details.acc>summary::-webkit-details-marker{display:none;}
  details.acc>summary::after{content:"+";font-size:1.2rem;color:var(--gold);}
  details.acc[open]>summary::after{content:"–";}
  details.acc .accbody{padding:0 16px 14px;font-size:.89rem;}
  details.acc .accbody ul{padding-left:18px;margin:6px 0;}
  details.acc .accbody li{margin-bottom:5px;}
  details.acc .accbody p{margin:0 0 8px;}
  details.acc .accbody p:last-child{margin-bottom:0;}

  .task, .tip{border-radius:14px;padding:18px 20px;margin-top:16px;font-size:.9rem;}
  .task{background:var(--teal-soft);border:1px solid rgba(44,110,88,.25);}
  .task .htag, .tip .htag{font-family:'JetBrains Mono',monospace;font-size:.68rem;text-transform:uppercase;
    letter-spacing:.08em;display:block;margin-bottom:6px;font-weight:700;}
  .task .htag{color:var(--teal);}
  .tip{background:var(--gold-soft);border:1px solid rgba(217,142,42,.35);}
  .tip .htag{color:#8a5a10;}

  .postab-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .posbtn{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);
    font-size:.82rem;font-weight:600;cursor:pointer;color:var(--ink-soft);}
  .posbtn.active{background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .poscontent{display:none;}
  .poscontent.active{display:block;}
  .poscontent ul{padding-left:20px;font-size:.9rem;}
  .poscontent li{margin-bottom:6px;}

  .quiz-q{border-top:1px solid var(--line);padding:18px 0;}
  .quiz-q:first-child{border-top:none;padding-top:4px;}
  .quiz-q .qtext{font-weight:700;margin-bottom:10px;font-size:.94rem;}
  .qopt{display:block;width:100%;text-align:left;padding:11px 14px;margin-bottom:8px;border-radius:10px;
    border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:.87rem;font-family:'Manrope',sans-serif;
    color:var(--ink);transition:.12s;}
  .qopt:hover{border-color:var(--indigo-2);}
  .qopt.correct{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:700;}
  .qopt.wrong{background:#F7E1DD;border-color:var(--pomegranate);color:var(--pomegranate);font-weight:700;}
  .qopt[disabled]{cursor:default;}
  .qexp{font-size:.82rem;color:var(--ink-soft);background:var(--paper);border-left:3px solid var(--gold);
    padding:8px 12px;border-radius:6px;margin-top:6px;display:none;}
  .qexp.show{display:block;}
  .quizscore{margin-top:16px;padding:14px 18px;border-radius:12px;background:var(--indigo);color:#fff;
    font-size:.88rem;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}

  footer{background:var(--indigo);color:rgba(255,255,255,.75);padding:34px 22px;text-align:center;font-size:.82rem;}
  footer strong{color:#fff;}

  .final-cert{background:linear-gradient(135deg,var(--indigo),var(--indigo-2));color:#fff;border-radius:20px;
    padding:34px 30px;text-align:center;margin-top:10px;}
  .final-cert .ringbig{width:120px;height:120px;border-radius:50%;margin:0 auto 16px;
    background:conic-gradient(var(--gold) calc(var(--fpct,0)*1%), rgba(255,255,255,.18) 0);
    display:flex;align-items:center;justify-content:center;}
  .final-cert .ringbig span{width:96px;height:96px;border-radius:50%;background:var(--indigo);
    display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-size:1.5rem;font-weight:700;}
  .final-cert h3{margin:0 0 8px;}
  .final-cert p{color:rgba(255,255,255,.78);max-width:52ch;margin:0 auto 18px;font-size:.9rem;}
  .final-cert .cert-open-btn{background:var(--gold); color:var(--indigo); border:none; border-radius:11px; padding:13px 22px; font-weight:800; font-size:.9rem;}
  .final-cert .cert-open-btn:hover{background:#e7a24a;}

  .loading-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:var(--paper);}
  .spinner{width:34px; height:34px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--gold); animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-wrap p{color:var(--ink-soft); font-size:13.5px;}

  /* ================= CERTIFICATE ================= */
  .cert-page{min-height:100vh; background:#1c1836; display:flex; align-items:center; justify-content:center; padding:24px;}
  .cert-sheet{width:100%; max-width:820px; background:var(--paper-warm); border-radius:8px; padding:60px 56px;
    box-shadow:0 20px 60px rgba(0,0,0,.4); position:relative; border:10px solid var(--indigo); outline:2px solid var(--gold); outline-offset:-18px;}
  .cert-sheet .cert-kicker{text-align:center; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--pomegranate); font-weight:800; margin-bottom:6px;}
  .cert-sheet h1.cert-title{text-align:center; font-family:'Unbounded',sans-serif; font-size:26px; color:var(--indigo); margin-bottom:4px;}
  .cert-sheet .cert-sub{text-align:center; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:#7a7488; margin-bottom:34px;}
  .cert-sheet .cert-body{text-align:center;}
  .cert-sheet .cert-body .lbl{font-size:12.5px; color:#7a7488; letter-spacing:.05em; text-transform:uppercase; margin-bottom:10px;}
  .cert-sheet .cert-name{font-family:'Unbounded',sans-serif; font-size:30px; color:var(--indigo); border-bottom:2px solid var(--gold); display:inline-block; padding:0 24px 10px; margin-bottom:16px;}
  .cert-mtt-line{text-align:center; font-size:13px; color:#6a6482; margin-bottom:20px;}
  .cert-mtt-line b{color:var(--indigo);}
  .cert-sheet .cert-desc{font-size:14.5px; color:#48425e; line-height:1.7; max-width:560px; margin:0 auto 26px;}
  .cert-sheet .cert-desc b{color:var(--indigo);}
  .cert-sheet .cert-footer{display:flex; justify-content:space-between; align-items:flex-end; margin-top:44px; gap:20px;}
  .cert-sheet .cert-date{font-size:12.5px; color:#7a7488;}
  .cert-sheet .cert-seal{width:64px; height:64px; border-radius:50%; border:2.5px solid var(--gold); display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--pomegranate); flex-shrink:0;}
  .cert-sheet .cert-brand{font-size:12px; color:#7a7488; text-align:right;}
  .cert-sheet .cert-brand b{color:var(--indigo); font-family:'Unbounded',sans-serif; font-size:14px; display:block;}
  .cert-actions{max-width:820px; width:100%; display:flex; gap:12px; justify-content:center; margin-top:22px;}
  .cert-actions button{border:none; border-radius:11px; padding:13px 22px; font-weight:800; font-size:14px;}
  .cert-actions .btn-print{background:var(--gold); color:var(--indigo);}
  .cert-actions .btn-back{background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.4) !important;}
  .cert-mtt-field{max-width:820px; width:100%; margin-top:18px; text-align:center;}
  .cert-mtt-field label{display:block; font-size:12px; color:rgba(255,255,255,.7); margin-bottom:8px; font-weight:600;}
  .cert-mtt-field input{width:100%; max-width:420px; padding:11px 14px; border-radius:10px; border:1.5px solid rgba(255,255,255,.25); font-size:14px; outline:none; font-family:'Manrope',sans-serif; background:rgba(255,255,255,.08); color:#fff;}
  .cert-mtt-field input::placeholder{color:rgba(255,255,255,.4);}
  .cert-mtt-field input:focus{border-color:var(--gold);}
  @media print {
    body *{visibility:hidden;}
    .cert-sheet, .cert-sheet *{visibility:visible;}
    .cert-sheet{position:absolute; left:0; top:0; box-shadow:none; outline:2px solid var(--gold); outline-offset:-18px;}
    .cert-page{background:#fff; padding:0;}
  }
  @media (max-width:720px){
    .cert-sheet{padding:36px 22px;}
    .cert-sheet .cert-name{font-size:22px;}
    .cert-sheet h1.cert-title{font-size:20px;}
  }

  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} }
</style>

<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://elubafxoxbllogjwfcna.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsdWJhZnhveGJsbG9nandmY25hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMzg0OTYsImV4cCI6MjEwMjgxNDQ5Nn0.9T-HlCcIdX1fsznQ9mDaTVS5ynzTp-iS14cQwKhWyBc";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CERT_COURSE_TITLE = "Maktabgacha pedagogika — attestatsiyaga tayyorgarlik";

let MODULES = [];
let userCodes = [];
let state = { view:"loading", userName:null, userCode:null, mttName:"", answers:{} };
// answers[moduleId] = { qi: chosenOptionIndex }

function escapeHtmlCert(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadAllData(){
  const [{data:t, error:tErr}, {data:u, error:uErr}] = await Promise.all([
    sb.from('mp_topics').select('*').order('sort_order', {ascending:true}),
    sb.from('user_codes').select('*'),
  ]);
  if(tErr || uErr){ console.error(tErr||uErr); return false; }
  MODULES = (t||[]).map(r => ({
    id:r.id, num:r.num, title:r.title, kicker:r.kicker, intro:r.intro,
    isPosition:r.is_position, theory:r.theory, positions:r.positions||[],
    task:r.task, tip:r.tip, quiz:r.quiz||[]
  }));
  userCodes = (u||[]).map(r => ({ code:r.code, name:r.name, active:r.active }));
  return true;
}

async function loadProgress(code){
  const { data } = await sb.from('mp_progress').select('*').eq('code', code).maybeSingle();
  state.answers = data ? (data.answers || {}) : {};
}
async function saveProgress(){
  if(!state.userCode) return;
  await sb.from('mp_progress').upsert({
    code: state.userCode, answers: state.answers, updated_at: new Date().toISOString()
  }, { onConflict: 'code' });
}

function moduleAnsweredCount(mid){ return Object.keys(state.answers[mid] || {}).length; }
function moduleCorrectCount(mid){
  const m = MODULES.find(x=>x.id===mid);
  const ans = state.answers[mid] || {};
  let c = 0;
  Object.keys(ans).forEach(qi => { if(m.quiz[qi] && ans[qi] === m.quiz[qi].correct) c++; });
  return c;
}
function moduleDone(mid){
  const m = MODULES.find(x=>x.id===mid);
  return m && m.quiz.length > 0 && moduleAnsweredCount(mid) === m.quiz.length;
}
function doneModulesCount(){ return MODULES.filter(m => moduleDone(m.id)).length; }
function overallPct(){ return MODULES.length ? Math.round((doneModulesCount()/MODULES.length)*100) : 0; }

/* ================= RENDER ROOT ================= */
function render(){
  const app = document.getElementById("app");
  if(state.view === "loading") app.innerHTML = loadingHTML();
  else if(state.view === "login") app.innerHTML = renderLogin();
  else if(state.view === "main") app.innerHTML = renderMain();
  else if(state.view === "certificate") app.innerHTML = renderCertificate();
  bindEvents();
  if(state.view !== "main") window.scrollTo({top:0, behavior:"instant"});
}

function loadingHTML(){ return `<div class="loading-wrap"><div class="spinner"></div><p>Yuklanmoqda...</p></div>`; }

async function doLogin(){
  const val = (document.getElementById("loginInput").value || "").trim().toUpperCase();
  const err = document.getElementById("loginError");
  if(!val){ err.textContent = "Iltimos, kodni kiriting."; err.classList.add("show"); return; }
  const btn = document.getElementById("loginBtn");
  if(btn){ btn.disabled = true; btn.textContent = "Tekshirilmoqda..."; }
  const found = userCodes.find(u => u.code.toUpperCase() === val);
  if(found && found.active){
    state.view = "main"; state.userName = found.name; state.userCode = found.code;
    await loadProgress(found.code); render(); return;
  }
  if(btn){ btn.disabled = false; btn.textContent = "Kirish"; }
  err.textContent = (found && !found.active) ? "Bu kod faol emas." : "Kod topilmadi. Qayta tekshirib ko'ring.";
  err.classList.add("show");
}

/* ================= THEORY / MODULE RENDER ================= */
function renderTheory(m){
  if(m.isPosition){
    const btns = m.positions.map((p,i)=>`<button class="posbtn ${i===0?'active':''}" data-pos="${p.key}">${p.label}</button>`).join('');
    const panes = m.positions.map((p,i)=>`<div class="poscontent ${i===0?'active':''}" data-pos="${p.key}"><ul>${p.items.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('');
    return `<div class="postab-row">${btns}</div>${panes}`;
  }
  return m.theory;
}

function moduleHTML(m){
  const ans = state.answers[m.id] || {};
  const quizItems = m.quiz.map((q,qi)=>{
    const chosen = ans[qi];
    const done = chosen !== undefined;
    const opts = q.opts.map((o,oi)=>{
      let cls = "";
      if(done){ if(oi===q.correct) cls="correct"; else if(oi===chosen) cls="wrong"; }
      return `<button class="qopt ${cls}" data-oi="${oi}" ${done?"disabled":""}>${o}</button>`;
    }).join('');
    return `
    <div class="quiz-q" data-qi="${qi}" ${done?'data-done="1"':''}>
      <div class="qtext">${qi+1}. ${q.q}</div>
      ${opts}
      <div class="qexp ${done?'show':''}">${q.exp}</div>
    </div>`;
  }).join('');

  const answeredCount = moduleAnsweredCount(m.id);
  const correctCount = moduleCorrectCount(m.id);
  const finished = m.quiz.length > 0 && answeredCount === m.quiz.length;

  return `
  <div class="module" id="${m.id}" data-id="${m.id}">
    <div class="module-head">
      <div class="module-badge ${finished?'finished':''}" id="badge-${m.id}">${finished?'✓':m.num}</div>
      <div class="module-title">
        <span class="eyebrow" style="color:var(--pomegranate);">${m.kicker}</span>
        <h3>${m.title}</h3>
        <p>${m.intro}</p>
      </div>
    </div>
    <div class="chevron"></div>
    <div class="tabs">
      <button class="tabbtn active" data-tab="nazariya">Nazariya</button>
      <button class="tabbtn" data-tab="amaliy">Amaliy topshiriq</button>
      <button class="tabbtn" data-tab="test">Bilimni tekshirish</button>
    </div>
    <div class="tabpane active" data-pane="nazariya">
      ${renderTheory(m)}
    </div>
    <div class="tabpane" data-pane="amaliy">
      <div class="task"><span class="htag">Amaliy topshiriq</span>${m.task}</div>
      <div class="tip"><span class="htag">Maslahat</span>${m.tip}</div>
    </div>
    <div class="tabpane" data-pane="test">
      ${quizItems}
      <div class="quizscore" id="score-${m.id}">Natija: ${correctCount}/${m.quiz.length} to'g'ri · ${answeredCount}/${m.quiz.length} savolga javob berildi</div>
    </div>
  </div>`;
}

/* ================= QUIZ ANSWER HANDLER ================= */
function answerQuiz(mid, qi, oi){
  if(!state.answers[mid]) state.answers[mid] = {};
  if(state.answers[mid][qi] !== undefined) return;
  state.answers[mid][qi] = oi;
  render();
  saveProgress();
}

/* ================= EVENTS ================= */
function bindEvents(){
  const app = document.getElementById("app");

  const loginBtn = document.getElementById("loginBtn");
  if(loginBtn){
    loginBtn.addEventListener("click", doLogin);
    document.getElementById("loginInput").addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });
  }

  const logoutBtn = document.getElementById("logoutBtn");
  if(logoutBtn) logoutBtn.addEventListener("click", () => { state = {view:"login", userName:null, userCode:null, mttName:"", answers:{}}; render(); });

  // nav jump
  app.querySelectorAll("[data-jump]").forEach(el => {
    el.addEventListener("click", () => {
      const target = document.getElementById(el.dataset.jump);
      if(target) target.scrollIntoView({behavior:"smooth", block:"start"});
    });
  });

  // tabs
  app.querySelectorAll(".tabbtn").forEach(btn => {
    btn.addEventListener("click", () => {
      const mod = btn.closest(".module");
      mod.querySelectorAll(".tabbtn").forEach(b=>b.classList.remove("active"));
      mod.querySelectorAll(".tabpane").forEach(p=>p.classList.remove("active"));
      btn.classList.add("active");
      mod.querySelector(`.tabpane[data-pane="${btn.dataset.tab}"]`).classList.add("active");
    });
  });

  // position tabs
  app.querySelectorAll(".posbtn").forEach(btn => {
    btn.addEventListener("click", () => {
      const mod = btn.closest(".module");
      mod.querySelectorAll(".posbtn").forEach(b=>b.classList.remove("active"));
      mod.querySelectorAll(".poscontent").forEach(p=>p.classList.remove("active"));
      btn.classList.add("active");
      mod.querySelector(`.poscontent[data-pos="${btn.dataset.pos}"]`).classList.add("active");
    });
  });

  // quiz options
  app.querySelectorAll(".qopt").forEach(btn => {
    btn.addEventListener("click", () => {
      const qBlock = btn.closest(".quiz-q");
      if(qBlock.dataset.done) return;
      const modEl = btn.closest(".module");
      const mid = modEl.dataset.id;
      const qi = parseInt(qBlock.dataset.qi);
      const oi = parseInt(btn.dataset.oi);
      answerQuiz(mid, qi, oi);
    });
  });

  // certificate
  const openCertBtn = document.getElementById("openCertBtn");
  if(openCertBtn) openCertBtn.addEventListener("click", () => { state.view="certificate"; render(); });
  const certBackBtn = document.getElementById("certBackBtn");
  if(certBackBtn) certBackBtn.addEventListener("click", () => { state.view="main"; render(); });
  const certPrintBtn = document.getElementById("certPrintBtn");
  if(certPrintBtn) certPrintBtn.addEventListener("click", () => window.print());
  const mttInput = document.getElementById("certMttInput");
  if(mttInput){
    mttInput.addEventListener("input", (e) => {
      state.mttName = e.target.value;
      const line = document.getElementById("certMttLine");
      if(line) line.innerHTML = state.mttName ? ("Muassasa: <b>"+escapeHtmlCert(state.mttName)+"</b>") : "";
    });
  }
}

/* ================= INIT ================= */
async function init(){
  render();
  try{
    const ok = await loadAllData();
    if(!ok){
      document.getElementById("app").innerHTML = `<div class="loading-wrap"><p>Ma'lumotlarni yuklab bo'lmadi. Internetni tekshiring va sahifani yangilang.</p></div>`;
      return;
    }
  } catch(e){
    console.error(e);
    document.getElementById("app").innerHTML = `<div class="loading-wrap"><p>Ulanishda xatolik yuz berdi. Sahifani yangilab ko'ring.</p></div>`;
    return;
  }
  state.view = "login";
  render();
}
init();
</script>
